---
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      VITE_DISABLE_VERCEL_ANALYTICS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PNPM
        uses: pnpm/setup@v2
        with:
          version: 12
